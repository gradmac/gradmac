<script>
(()=>{

/* ---------- tokenizer + parser ---------- */
const FUNCS=['softmax','normF','sigma','norm','diag','tanh','det','exp','log','lse','inv','tr'];
function tokenize(s){

     .replace(/[‖|]([^‖|]*)[‖|]/g,'norm($1)').replace(/σ/g,'sigma').replace(/[·×]/g,'*').replace(/½/g,'(1/2)');
  const t=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue}
    if(/[0-9.]/.test(c)){const m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);if(!m)throw 0;t.push({t:'num',v:+m[0]});i+=m[0].length;continue}
    if(/[A-Za-z]/.test(c)){
      const f=FUNCS.find(fn=>s.startsWith(fn,i)&&/^\s*\(/.test(s.slice(i+fn.length)));
      if(f){t.push({t:'fn',v:f});i+=f.length;continue}
      if(c==='d'&&/[A-Za-z]/.test(s[i+1]||'')){t.push({t:'var',v:'d'+s[i+1]});i+=2;continue}
      t.push({t:'var',v:c});i++;continue}

function parse(src){

  const startsAtom=k=>k&&(k.t==='num'||k.t==='var'||k.t==='fn'||k.t==='(');

  function term(){let n=unary();for(;;){const k=peek();
    if(k&&k.t==='*'){p++;n={k:'mul',a:n,b:unary()}}

const ren=(n,m)=>{if(n.k==='var'){const v=n.v;if(v.length===2&&v[0]==='d')return{...n,v:'d'+(m[v[1]]||v[1])};return{...n,v:m[v]||v}}
  const o={...n};if(n.a)o.a=ren(n.a,m);if(n.b)o.b=ren(n.b,m);return o};
const varsOf=(n,s=new Set())=>{if(n.k==='var')s.add(n.v);if(n.a)varsOf(n.a,s);if(n.b)varsOf(n.b,s);return s};

/* AST builders */
const A_={num:v=>({k:'num',v}),mul:(a,b)=>({k:'mul',a,b}),add:(a,b,op='+')=>({k:'add',op,a,b}),div:(a,b)=>({k:'div',a,b}),
  fn:(f,a)=>({k:'fn',f,a}),par:a=>({k:'par',a}),pow:(a,n)=>({k:'post',v:'pow',n,a}),T:a=>({k:'post',v:'T',a})};
const atomic=n=>n.k==='var'||n.k==='num'||n.k==='fn'||n.k==='par'||(n.k==='post'&&atomic(n.a));

const parenAdd=n=>(n.k==='add'||n.k==='neg')?A_.par(n):n;

/* s·g with any leading number of g pulled to the front */
function scal(s,g,k=1){const[c,rest]=splitCoef(g);const coef=(c??1)*k;const body=A_.mul(s,parenAdd(rest||g));
  if(c!==null&&!rest)return coef===1?s:A_.mul(A_.num(coef),s);
  return coef===1?body:A_.mul(A_.num(coef),body)}

/* ---------- render AST to math HTML ---------- */
const lead=n=>(n.k==='mul'||n.k==='div'||n.k==='add'||n.k==='post')?lead(n.a):n;

const tk=(k,h)=>({k,h:h??k});

  case'mul':{const l=lead(n.b),tl=x=>x.k==='mul'?tl(x.b):x;
    let sep=l.k==='num'?' · ':(l.k==='fn'&&['tr','det','log','exp','softmax','tanh','diag'].includes(l.f))||isD(l)||isD(tl(n.a))?' ':'';
    return[...RT(n.a),...(sep?[tk('_',sep)]:[]),...RT(n.b)]}
  case'div':if(n.a.k==='num'&&n.b.k==='num'&&n.a.v===1&&n.b.v===2)return[tk('½')];return[...RT(n.a),tk('/',' / '),...RT(n.b)];
  case'par':return[tk('('),...RT(n.a),tk(')')];
  case'post':return[...RT(n.a),tk('^'+n.v+(n.n||''),{T:'<sup>⊤</sup>',inv:'<sup>−1</sup>',invT:'<sup>−⊤</sup>'}[n.v]||`<sup>${n.n}</sup>`)];
  case'fn':{const a=n.a;
    if(n.f==='norm')return[tk('‖'),...RT(a),tk('‖')];
    if(n.f==='normF')return[tk('‖'),...RT(a),tk('‖F','‖<sub>F</sub>')];
    if(n.f==='sigma')return[tk('σ('),...RT(a),tk(')')];
    if(n.f==='inv')return[tk('('),...RT(a),tk(')'),tk('^inv','<sup>−1</sup>')];
    if(n.f==='lse')return[tk('lse(','log Σ<sub><i>i</i></sub> exp('),...RT(a),tk('lse)','<sub><i>i</i></sub>)')];
    if(n.f==='log'&&a.k==='fn'&&a.f==='det'&&(a.a.k==='var'||a.a.k==='par'))return[tk('logdet',`log det${a.a.k==='var'?' ':''}`),...RT(a.a)];
    if(top&&n.f==='det'&&a.k==='var')return[tk('det ','det '),...RT(a)];
    return[tk(n.f+'(',n.f+'('),...RT(a),tk(')')]}
}}
const R=(n,top)=>RT(n,top).map(t=>t.h).join('');
/* tokens of cur that are not in the longest common subsequence with prev get highlighted */
function hlDiff(prev,cur){const n=prev.length,m=cur.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=prev[i].k===cur[j].k?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const keep=new Array(m).fill(false);let i=0,j=0;while(i<n&&j<m){if(prev[i].k===cur[j].k){keep[j]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  let h='',open=false;cur.forEach((t,j)=>{const mark=!keep[j]&&t.k!=='_';if(mark&&!open){h+='<span class="hl">';open=true}if(!mark&&open&&t.k!=='_'){h+='</span>';open=false}h+=t.h});if(open)h+='</span>';return h}
const RULES={
 lin:['linearity','d tr(<i>P</i>) = tr(d<i>P</i>), &nbsp;d(<i>a</i><sup>⊤</sup><i>P</i><i>b</i>) = <i>a</i><sup>⊤</sup>d<i>P</i> <i>b</i>'],
 prod:['product rule','d(<i>PQ</i>) = d<i>P</i> <i>Q</i> + <i>P</i> d<i>Q</i>'],
 cyc:['cycle the trace','tr(<i>PQR</i>) = tr(<i>RPQ</i>)'],
 trT:['transpose a scalar','tr(<i>P</i>) = tr(<i>P</i><sup>⊤</sup>), &nbsp;<i>a</i><sup>⊤</sup><i>b</i> = <i>b</i><sup>⊤</sup><i>a</i>'],
 sca:['scalar as a trace','<i>a</i><sup>⊤</sup><i>P</i><i>b</i> = tr(<i>b</i><i>a</i><sup>⊤</sup><i>P</i>)'],
 collect:['collect terms','tr(<i>P</i> d<i>X</i>) + tr(<i>Q</i> d<i>X</i>) = tr((<i>P</i> + <i>Q</i>) d<i>X</i>)'],
 eye:['identity','d<i>X</i> = <i>I</i> d<i>X</i>'],
 sym:['symmetric','<i>A</i> = <i>A</i><sup>⊤</sup>, so <i>x</i><sup>⊤</sup>(<i>A</i> + <i>A</i><sup>⊤</sup>) = 2<i>x</i><sup>⊤</sup><i>A</i>'],
 norm:['squared norm','d‖<i>v</i>‖<sup>2</sup> = 2<i>v</i><sup>⊤</sup>d<i>v</i>, &nbsp;d‖<i>V</i>‖<sub>F</sub><sup>2</sup> = 2 tr(<i>V</i><sup>⊤</sup>d<i>V</i>)'],
 normr:['norm','d‖<i>v</i>‖ = <i>v</i><sup>⊤</sup>d<i>v</i> / ‖<i>v</i>‖'],
 inv:['inverse','d(<i>X</i><sup>−1</sup>) = −<i>X</i><sup>−1</sup> d<i>X</i> <i>X</i><sup>−1</sup>'],
 invp:['inverse of a product','(<i>PQ</i>)<sup>−1</sup> = <i>Q</i><sup>−1</sup><i>P</i><sup>−1</sup>'],
 det:['determinant','d det <i>X</i> = det <i>X</i> · tr(<i>X</i><sup>−1</sup>d<i>X</i>)'],

 exp:['exp','d exp(<i>u</i>) = exp(<i>u</i>) d<i>u</i>'],
 log:['log','d log <i>u</i> = d<i>u</i> / <i>u</i>'],
 lse:['log-sum-exp','d lse(<i>v</i>) = softmax(<i>v</i>)<sup>⊤</sup>d<i>v</i>'],

 sig:['sigmoid','dσ(<i>u</i>) = σ(1 − σ) d<i>u</i>'],

 quot:['quotient','d(<i>u</i>/<i>v</i>) = d<i>u</i>/<i>v</i> − <i>u</i> d<i>v</i>/<i>v</i><sup>2</sup>'],
 read:['read off','d<i>f</i> = tr(<i>G</i> d<i>X</i>) ⇒ ∇<i>f</i> = <i>G</i><sup>⊤</sup>; &nbsp;d<i>f</i> = <i>g</i><sup>⊤</sup>d<i>x</i> ⇒ ∇<i>f</i> = <i>g</i>'],

/* ---------- numeric evaluation ---------- */
const N=3;
const M=(r,c,d)=>({r,c,d});
const S=v=>M(1,1,[v]);
const isS=m=>m.r===1&&m.c===1;
const eye=()=>M(N,N,Array.from({length:N*N},(_,i)=>i%(N+1)===0?1:0));
const rnd=()=>Math.random()*2-1;
function randM(sym){const d=Array.from({length:N*N},rnd);if(sym)for(let i=0;i<N;i++)for(let j=0;j<i;j++)d[i*N+j]=d[j*N+i];for(let i=0;i<N;i++)d[i*N+i]+=1.5;return M(N,N,d)}
const randV=()=>M(N,1,Array.from({length:N},rnd));
const tp=a=>{const d=[];for(let j=0;j<a.c;j++)for(let i=0;i<a.r;i++)d.push(a.d[i*a.c+j]);return M(a.c,a.r,d)};
const scale=(k,a)=>M(a.r,a.c,a.d.map(v=>v*k));
function addM(a,b,s){if(a.r!==b.r||a.c!==b.c)throw 0;return M(a.r,a.c,a.d.map((v,i)=>v+s*b.d[i]))}

  const d=new Array(a.r*b.c).fill(0);for(let i=0;i<a.r;i++)for(let k=0;k<a.c;k++)for(let j=0;j<b.c;j++)d[i*b.c+j]+=a.d[i*a.c+k]*b.d[k*b.c+j];return M(a.r,b.c,d)}

  return M(n,n,A.flatMap(r=>r.slice(n)))}

  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;if(p!==c){[A[c],A[p]]=[A[p],A[c]];det=-det}
    if(Math.abs(A[c][c])<1e-14)return 0;det*=A[c][c];for(let r=c+1;r<n;r++){const f=A[r][c]/A[c][c];for(let j=c;j<n;j++)A[r][j]-=f*A[c][j]}}return det}
const ew=(a,f)=>M(a.r,a.c,a.d.map(f));

  case'fn':{const a=E(n.a,env);switch(n.f){
    case'tr':{if(a.r!==a.c)throw 0;let s=0;for(let i=0;i<a.r;i++)s+=a.d[i*a.c+i];return S(s)}
    case'det':return S(detM(a));
    case'norm':case'normF':return S(Math.sqrt(a.d.reduce((s,v)=>s+v*v,0)));
    case'diag':{const n=a.d.length,d=new Array(n*n).fill(0);for(let i=0;i<n;i++)d[i*n+i]=a.d[i];return M(n,n,d)}
    case'tanh':return ew(a,Math.tanh);
    case'exp':return ew(a,Math.exp);
    case'log':return ew(a,Math.log);
    case'sigma':return ew(a,v=>1/(1+Math.exp(-v)));
    case'inv':return invM(a);
    case'softmax':{const e=a.d.map(Math.exp),z=e.reduce((s,v)=>s+v,0);return M(a.r,a.c,e.map(v=>v/z))}
    case'lse':return S(Math.log(a.d.reduce((s,v)=>s+Math.exp(v),0)))}}
}}
function same(a,b){if(a.r!==b.r||a.c!==b.c)return false;const sc=1+Math.max(...b.d.map(Math.abs));return a.d.every((v,i)=>Number.isFinite(v)&&Math.abs(v-b.d[i])<=1e-7*sc)}

/* ---------- curated problems ----------
   L: level 1 linear · 2 quadratic · 3 inverse/det · 4 nonlinear/chain

   pre: optional intermediate form of the gradient before the simplified answer

const CUR=[
 // level 1
 {w:["lin"],L:1,v:'x',f:"a'x",steps:["a'dx"],ans:"a"},

 {w:["lin", "trT", "cyc"],L:1,v:'X',f:"tr(AX')",steps:["tr(A dX')","tr(dX A')","tr(A'dX)"],ans:"A"},
 {w:["lin", "cyc"],L:1,v:'X',f:"tr(AXB)",steps:["tr(A dX B)","tr(BA dX)"],pre:"(BA)'",ans:"A'B'"},

const CURP=CUR.map(c=>({w:c.w,L:c.L,v:c.v,sym:c.sym||[],pos:!!c.pos,

/* ---------- generator: chain and product rule over simple bases ---------- */
const BASES=CURP.filter(p=>p.L<=2&&!p.cond&&!p.s);
const L1=BASES.filter(p=>p.L===1),L2B=BASES.filter(p=>p.L===2);
const SWAP={A:'C',B:'D',C:'A',D:'B',a:'c',b:'e',c:'a',e:'b'};
const lastStep=p=>p.steps[p.steps.length-1];
const pickVar=(arr,v)=>{const c=arr.filter(p=>p.v===v);return c[Math.floor(Math.random()*c.length)]};
/* level 1: weighted sums of two linear bases */
function numMul(k,g){const[c,rest]=splitCoef(g);const coef=(c??1)*k;if(!rest)return A_.num(coef);return coef===1?rest:A_.mul(A_.num(coef),parenAdd(rest))}
function genLinear(){
  for(let t=0;t<30;t++){
    const v=Math.random()<.35?'x':'X';const b=pickVar(L1,v),q=pickVar(L1,v);
    const u1=b.f,u2=ren(q.f,SWAP);if(R(u1)===R(u2))continue;
    const d1=lastStep(b),d2=ren(lastStep(q),SWAP),g1=b.ans,g2=ren(q.ans,SWAP);
    const k=pick([1,1,2,3,-1]);const out={w:['lin'],L:1,v,sym:[],cond:null,s:null,pre:null,gen:true};
    if(k===-1){out.f=A_.add(u1,parenAdd(u2),'-');out.steps=[A_.add(d1,parenAdd(d2),'-')];out.ans=A_.add(g1,parenAdd(g2),'-')}
    else if(k===1){out.f=A_.add(u1,u2);out.steps=[A_.add(d1,d2)];out.ans=A_.add(g1,g2)}
    else{out.f=A_.add(u1,A_.mul(A_.num(k),paren(u2)));out.steps=[A_.add(d1,A_.mul(A_.num(k),parenAdd(d2)))];out.ans=A_.add(g1,numMul(k,g2))}

}
/* level 3: substitute X -> X^-1 into a matrix base, or add log det X */
function subInv(n){
  if(n.k==='post'&&n.v==='T'&&n.a.k==='var'&&n.a.v==='X')return{k:'post',v:'invT',a:n.a};
  if(n.k==='var'&&n.v==='X')return{k:'post',v:'inv',a:n};
  const o={...n};if(n.a)o.a=subInv(n.a);if(n.b)o.b=subInv(n.b);return o}
function trForm(st){let k=1,n=st;if(n.k==='mul'&&n.a.k==='num'){k=n.a.v;n=n.b}
  if(n.k==='fn'&&n.f==='tr'&&n.a.k==='mul'&&n.a.b.k==='var'&&n.a.b.v==='dX')return{k,G:n.a.a};return null}
const INVB=BASES.filter(p=>p.v==='X'&&trForm(lastStep(p)));
function genInverse(){
  const Xi={k:'post',v:'inv',a:{k:'var',v:'X'}},XiT={k:'post',v:'invT',a:{k:'var',v:'X'}},dX={k:'var',v:'dX'};
  if(Math.random()<.45){
    const b=pickVar(BASES,'X'),ld=parse('log(det(X))'),dl=parse('tr(X^-1 dX)'),k=pick([1,1,2,3,-1]);
    const o={w:['logdet'],L:3,v:'X',sym:b.sym,cond:'det(X) > 0',s:null,pre:null,gen:true};
    if(k===-1){o.f=A_.add(ld,parenAdd(b.f),'-');o.steps=[A_.add(dl,parenAdd(lastStep(b)),'-')];o.ans=A_.add(XiT,parenAdd(b.ans),'-')}
    else if(k===1){o.f=A_.add(ld,b.f);o.steps=[A_.add(dl,lastStep(b))];o.ans=A_.add(XiT,b.ans)}
    else{o.f=A_.add(ld,A_.mul(A_.num(k),paren(b.f)));o.steps=[A_.add(dl,A_.mul(A_.num(k),parenAdd(lastStep(b))))];o.ans=A_.add(XiT,numMul(k,b.ans))}
    return o}
  const b=INVB[Math.floor(Math.random()*INVB.length)];const{k,G}=trForm(lastStep(b));const Gp=parenAdd(subInv(G));
  const kk=n=>k===1?n:A_.mul(A_.num(k),n);

  const s2={k:'neg',a:kk(A_.fn('tr',A_.mul(A_.mul(A_.mul(Xi,Gp),Xi),dX)))};

/* topic sections: weighted sums of two curated problems from the same section */
const plain=n=>R(n).replace(/<[^>]+>/g,'');
function genSection(L){
  const pool=CURP.filter(p=>p.L===L&&!p.cond&&!p.s&&!p.sym.length&&plain(p.ans).length<=34);
  for(let t=0;t<40;t++){
    const v=Math.random()<.4?'x':'X',cand=pool.filter(p=>p.v===v);if(cand.length<2)continue;
    const b=cand[Math.floor(Math.random()*cand.length)],q=cand[Math.floor(Math.random()*cand.length)];
    const u1=b.f,u2=ren(q.f,SWAP);if(R(u1)===R(u2))continue;
    const d1=lastStep(b),d2=ren(lastStep(q),SWAP),g1=b.ans,g2=ren(q.ans,SWAP);
    if(plain(g1).length+plain(g2).length>64)continue;
    const out={w:['lin'],L,v,sym:[],cond:null,s:null,pre:null,gen:true};
    out.f=A_.add(u1,u2);out.steps=[A_.add(d1,d2)];out.ans=A_.add(g1,g2);return out}
  return null}
function generate(level){
  if(level>=5)return genSection(level);

  if(level===3)return genInverse();
  const v=Math.random()<.5?'x':'X';
  const kinds=level===2?['sum']:['square','exp','sigma','log1p','prod','sum'];
  const kind=kinds[Math.floor(Math.random()*kinds.length)];
  const b=pickVar(L1,v),u=b.f,du=lastStep(b),g=b.ans;
  const out={w:[],L:level,v,sym:[],cond:null,s:null,pre:null,gen:true};
  if(kind==='square'){out.w=['chain'];out.f=A_.pow(paren(u),2);out.steps=[A_.mul(A_.num(2),A_.mul(paren(u),parenAdd(du)))];out.ans=scal(paren(u),g,2)}
  else if(kind==='exp'){out.w=['exp'];const e=A_.fn('exp',u);out.f=e;out.steps=[A_.mul(e,parenAdd(du))];out.ans=scal(e,g)}
  else if(kind==='sigma'){out.w=['sig'];const ss=parse('s(1 - s)');out.f=A_.fn('sigma',u);out.s=A_.fn('sigma',u);out.steps=[A_.mul(ss,parenAdd(du))];out.ans=scal(ss,g)}
  else if(kind==='log1p'){out.w=['log'];const p=pickVar(L2B.filter(q=>q.pos),v);const den=A_.par(A_.add(A_.num(1),p.f));
    out.f=A_.fn('log',A_.add(A_.num(1),p.f));out.steps=[A_.div(parenAdd(lastStep(p)),den)];out.ans=A_.div(parenAdd(p.ans),den)}
  else if(kind==='prod'){out.w=['prod'];const q=pickVar(L1,v),u2=ren(q.f,SWAP),d2=ren(lastStep(q),SWAP),g2=ren(q.ans,SWAP);
    out.f=A_.mul(paren(u),paren(u2));out.steps=[A_.add(A_.mul(paren(u2),parenAdd(du)),A_.mul(paren(u),parenAdd(d2)))];out.ans=A_.add(scal(paren(u2),g),scal(paren(u),g2))}
  else{out.w=['lin'];const q=pickVar(L2B,v),u2=ren(q.f,SWAP),d2=ren(lastStep(q),SWAP),g2=ren(q.ans,SWAP);
    out.f=A_.add(u,u2);out.steps=[A_.add(du,d2)];out.ans=A_.add(g,g2);out.sym=(q.sym||[]).map(c=>SWAP[c])}

}

/* ---------- distractors for choice mode ---------- */
function nodesOf(n,path=[],acc=[]){acc.push(path);if(n.a)nodesOf(n.a,[...path,'a'],acc);if(n.b)nodesOf(n.b,[...path,'b'],acc);return acc}
const getAt=(n,p)=>p.reduce((x,k)=>x[k],n);
function setAt(n,p,val){if(!p.length)return val;const o={...n};o[p[0]]=setAt(n[p[0]],p.slice(1),val);return o}
function mutate(ans){
  const paths=nodesOf(ans);
  for(let t=0;t<20;t++){
    const p=paths[Math.floor(Math.random()*paths.length)],n=getAt(ans,p);let r=null;
    if(n.k==='var'&&/[A-Z]/.test(n.v)&&n.v!=='I')r=A_.T(n);
    else if(n.k==='var'&&/[a-z]/.test(n.v)&&n.v!=='s')r=A_.T(n);
    else if(n.k==='post'&&n.v==='T')r=n.a;
    else if(n.k==='post'&&n.v==='inv')r={...n,v:'invT'};
    else if(n.k==='post'&&n.v==='invT')r=Math.random()<.5?{...n,v:'inv'}:A_.T(n.a);
    else if(n.k==='num')r=A_.num(n.v===2?1:n.v*2);
    else if(n.k==='mul')r=A_.mul(n.b,n.a);
    else if(n.k==='add')r={...n,op:n.op==='+'?'-':'+'};
    else if(n.k==='neg')r=n.a;
    else if(n.k==='div')r=A_.mul(n.a,n.b);
    if(r)return setAt(ans,p,r);
  }
  return Math.random()<.5?A_.mul(A_.num(2),ans):A_.T(A_.par(ans));

const TOPICS={ml:5,nn:6,tf:7,rnn:8,rl:9};
/* ---------- instantiate a problem with fresh letters and test values ---------- */
let lastKey='';
function pickSpec(level){
  const lv=level==='all'?1+Math.floor(Math.random()*4):(TOPICS[level]||+level);
  const genShare=lv===2?.25:.5;
  if(Math.random()<genShare){const g=generate(lv);if(g)return g}
  const pool=CURP.filter(p=>p.L===lv);let s;
  for(let i=0;i<10;i++){s=pool[Math.floor(Math.random()*pool.length)];if(R(s.f)!==lastKey)break}
  lastKey=R(s.f);return s;
}
function relHTML(c,m){const mm=c.match(/^(.*?)\s*(=|>)\s*(.*)$/);const side=x=>/^\d+$/.test(x.trim())?x.trim():R(ren(parse(x),m),true);return`${side(mm[1])} ${mm[2]} ${side(mm[3])}`}

  const rows=stepsA.map((x,i)=>({lhs:i?'':'d<i>f</i>',h:hlDiff(toks[i],toks[i+1]),w:w[i]}));
  if(preA){rows.push({lhs:g,h:R(preA),w:'read',fin:1});rows.push({lhs:'',h:R(ansA),w:'tpp',fin:1})}

  for(let attempt=0;attempt<20;attempt++){

    const m={A:mats[0],B:mats[1],C:mats[2],D:mats[3],a:vecs[0],b:vecs[1],c:vecs[2],e:vecs[3],X:pick(['X','W']),x:pick(['x','w','z'])};

    const vs=new Set([...varsOf(fA),...varsOf(ansA),...(sA?varsOf(sA):[])]);

    try{
      envs=[0,1].map(()=>{const e={I:eye()};vs.forEach(v=>{if(v.length===2)return;e[v]=/[A-Z]/.test(v)?randM(symSet.has(v)):randV()});if(sA)e.s=E(sA,e);return e});

      if(val&&seen.some(s=>same(val,s)))continue;const h=R(w);if(opts.includes(h))continue;opts.push(h);if(val)seen.push(val)}
    if(opts.length<4)continue;

    return{L:t.L,f:R(fA,true),vv:`<i>${m[t.v]}</i>`,dv:`d<i>${m[t.v]}</i>`,cond,ansH,envs,expected,opts:sh,ci:sh.indexOf(ansH),

function check(p,src){let n;try{n=parse(src)}catch(e){return{ok:false}}

const API='/api',apiOK=/^https?:$/.test(location.protocol);
const board=()=>`${level}:${dur}`;
let me={signedIn:false},cfg=null,pendingPost=false,view=store.get('gg:view'),schoolsCache={};
const myTag=()=>me.signedIn&&me.tag&&me.showTag?me.tag:null;
async function api(path,body){const r=await fetch(API+path,body===undefined?{cache:'no-cache'}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,j}}
/* board view: 'all' (everyone), 'rank' (school rankings) or 'tag:<school>' */
const curView=()=>{if(view==='all'||view==='rank'||(view&&view.startsWith('tag:')))return view;return myTag()?'tag:'+myTag():'all'};
let bust=0;const bq=()=>bust?`&t=${bust}`:'';
async function loadSchools(b=board()){if(!apiOK)return null;try{const {ok,j}=await api(`/schools?board=${encodeURIComponent(b)}${bq()}`);if(ok){schoolsCache[b]=j;return j}}catch(e){}return null}
function renderFilters(){const data=schoolsCache[board()]||{schools:[],ranking:[]},v=curView(),t=myTag();
  const names=data.schools.map(x=>x.tag);if(t&&!names.includes(t))names.unshift(t);if(v.startsWith('tag:')&&!names.includes(v.slice(4)))names.push(v.slice(4));
  const counts=Object.fromEntries(data.schools.map(x=>[x.tag,x.players]));
  for(const id of ['filt','filt2']){const el=$(id);if(!el)continue;el.hidden=!apiOK||(!names.length&&v==='all');if(el.hidden)continue;
    const sel=document.createElement('select');sel.className='bsel';sel.setAttribute('aria-label','Which leaderboard');
    const opt=(val,label)=>{const o=document.createElement('option');o.value=val;o.textContent=label;return o};
    sel.append(opt('all','everyone'),opt('rank','school rankings'));
    if(names.length){const g=document.createElement('optgroup');g.label='schools';
      names.forEach(n=>g.append(opt('tag:'+n,(n===t?'★ ':'')+n+(counts[n]?` (${counts[n]})`:''))));sel.append(g)}
    sel.value=v;sel.addEventListener('change',()=>{view=sel.value;store.set('gg:view',view);renderFilters();loadBoard($('lb'));if(!$('done').hidden)loadBoard($('lb2'))});
    el.replaceChildren(sel)}}
async function refreshBoards(){await loadSchools();renderFilters();loadBoard($('lb'));if(!$('done').hidden)loadBoard($('lb2'))}
async function loadBoard(el,b=board()){
  if(!apiOK){el.hidden=true;return}
  const v=curView();
  const row=(i,name,sub,val,me_)=>{const li=document.createElement('li');const a=document.createElement('span');a.textContent=i+1;
    const n=document.createElement('span');n.textContent=name;if(sub){const g=document.createElement('span');g.className=sub[1];g.textContent=sub[0];n.append(g)}
    const sc=document.createElement('b');sc.textContent=val;li.append(a,n,sc);if(me_)li.className='me';return li};
  try{
    if(v==='rank'){const data=schoolsCache[b]||await loadSchools(b);if(b!==board()||curView()!=='rank')return;
      const r=(data&&data.ranking)||[];
      el.replaceChildren(...r.map((x,i)=>row(i,x.tag,[`${x.players} players`,'np'],x.avg,x.tag===myTag())));
      {const note=document.createElement('li');note.style.display='block';note.style.color='var(--mute)';note.style.fontSize='12px';note.textContent='average of each school’s top 5 · schools need 3+ players';el.append(note)}
      if(!r.length){const li=document.createElement('li');li.style.display='block';li.style.color='var(--mute)';li.textContent='no school has 3 players on this board yet';el.replaceChildren(li)}
      el.hidden=false;return}
    const tag=v.startsWith('tag:')?v.slice(4):null;
    const {ok,j}=await api(`/scores?board=${encodeURIComponent(b)}`+(tag?`&tag=${encodeURIComponent(tag)}`:'')+bq());if(!ok)throw 0;
    if(b!==board()||curView()!==v)return;
    el.replaceChildren(...j.top.map((t,i)=>row(i,t.name,t.tag&&!tag?[t.tag,'tg']:null,t.score,me.username&&t.name===me.username)));
    if(!j.top.length&&tag){const li=document.createElement('li');li.style.display='block';li.style.color='var(--mute)';li.textContent=`no ${tag} scores on this board yet`;el.replaceChildren(li);el.hidden=false;return}
    el.hidden=!j.top.length}catch(e){el.hidden=true}}
function renderAcct(){const b=$('acct');b.hidden=!apiOK;b.textContent=me.signedIn&&me.username?'@'+me.username:'sign in';renderFilters();renderPostBtn()}
async function loadMe(){if(!apiOK)return;try{const {ok,j}=await api('/me');if(ok)me=j}catch(e){}renderAcct()}
/* panel */
function closePanel(){$('panel').hidden=true;$('scrim').hidden=true;pendingPost=false}
function panelMsg(t){$('pmsg').textContent=t||''}
let gsiLoad=null;
function loadGsi(){return gsiLoad||(gsiLoad=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=res;sc.onerror=()=>{gsiLoad=null;rej()};document.head.append(sc)}))}
async function openPanel(){
  $('panel').hidden=false;$('scrim').hidden=false;panelMsg('');const body=$('pbody');
  if(!me.signedIn){
    $('ptitle').textContent=pendingPost?'sign in to post your score':'sign in';
    body.innerHTML='<div id="gsi"></div><p>Signing in is only needed for the leaderboard. We keep your username and, for school Google accounts, your school&rsquo;s name. Never your email. <a href="/privacy" target="_blank" rel="noopener">Privacy</a></p>';
    try{if(!cfg){const {j}=await api('/config');cfg=j}
      if(!cfg.googleClientId){panelMsg('Sign-in isn’t set up yet.');return}
      await loadGsi();
      google.accounts.id.initialize({client_id:cfg.googleClientId,callback:onCredential,auto_select:false,itp_support:true,use_fedcm_for_prompt:true});
      const dark=getComputedStyle(document.body).backgroundColor==='rgb(0, 0, 0)';
      google.accounts.id.renderButton($('gsi'),{theme:dark?'filled_black':'outline',size:'large',text:'signin_with',shape:'rectangular',width:260});
    }catch(e){panelMsg('Couldn’t load Google sign-in. Check your connection and try again.')}
    return}
  if(!me.username){
    $('ptitle').textContent='pick your username';
    body.innerHTML=`<p>This is how you'll appear on the leaderboard. You can't change it later.</p>
      <form id="uform" style="display:flex;flex-direction:column;gap:12px;width:100%"><input class="field" id="uname" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="username" aria-label="Username">
      ${me.tag?`<label class="check"><input type="checkbox" id="showtag" checked> show my <b></b> tag</label>`:''}
      <button class="go" type="submit">save</button></form>`;
    if(me.tag)body.querySelector('.check b').textContent=me.tag;
    $('uform').addEventListener('submit',async e=>{e.preventDefault();const u=$('uname').value.trim();
      if(!/^[A-Za-z0-9_.-]{3,16}$/.test(u)){panelMsg('3–16 letters, digits, . _ or -');return}
      panelMsg('saving…');const {ok,j}=await api('/me',{username:u,showTag:me.tag?$('showtag').checked:true});
      if(!ok){panelMsg(j.error||'couldn’t save');return}
      me=j;renderAcct();finishSignIn()});
    setTimeout(()=>$('uname').focus(),0);return}
  $('ptitle').textContent='@'+me.username;
  body.innerHTML=(me.tag?`<label class="check"><input type="checkbox" id="showtag2"${me.showTag?' checked':''}> show my <b></b> tag</label>`:'<p>No school tag. Tags come from school Google accounts (like @berkeley.edu).</p>')
    +'<button class="linkbtn" id="signout" type="button">sign out</button>';
  if(me.tag){body.querySelector('.check b').textContent=me.tag;
    $('showtag2').addEventListener('change',async e=>{const {ok,j}=await api('/me',{showTag:e.target.checked});if(ok){me=j;renderAcct();loadBoard($('lb'))}})}
  $('signout').addEventListener('click',async()=>{await api('/logout',{});me={signedIn:false};renderAcct();closePanel();loadBoard($('lb'))});
}
async function onCredential(resp){
  panelMsg('signing in…');
  const {ok,j}=await api('/auth/google',{credential:resp.credential});
  if(!ok){panelMsg(j.error||'sign-in failed');return}
  me=j;renderAcct();
  if(!me.username){openPanel();return}
  finishSignIn()}
function finishSignIn(){const post=pendingPost;$('panel').hidden=true;$('scrim').hidden=true;pendingPost=false;refreshBoards();if(post)postScore()}
$('acct').addEventListener('click',()=>{pendingPost=false;openPanel()});
$('pclose').addEventListener('click',closePanel);$('scrim').addEventListener('click',closePanel);
function renderPostBtn(){const b=$('postbtn');if(!b)return;b.textContent=me.signedIn&&me.username?'post score':'sign in to post'}
let lbTimer=0,lastRun=null;
function syncChips(){
  clearTimeout(lbTimer);lbTimer=setTimeout(refreshBoards,150);
  if($('mbest'))$('mbest').textContent=`best ${getBest()}`;
  document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  document.querySelectorAll('#durs button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.d===dur));
  document.querySelectorAll('#lvls button,#topics button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===level));
  $('lvlhint').innerHTML={'1':`<i>a</i><sup>⊤</sup><i>x</i>, &nbsp;tr(<i>AXB</i>), &nbsp;<i>a</i><sup>⊤</sup><i>Xb</i>`,
    '2':`<i>x</i><sup>⊤</sup><i>Ax</i>, &nbsp;‖<i>Ax</i> − <i>b</i>‖<sup>2</sup>, &nbsp;tr(<i>X</i><sup>⊤</sup><i>AX</i>)`,
    '3':`log det <i>X</i>, &nbsp;tr(<i>X</i><sup>−1</sup><i>A</i>), &nbsp;<i>a</i><sup>⊤</sup><i>X</i><sup>−1</sup><i>b</i>`,
    '4':`σ(<i>a</i><sup>⊤</sup><i>x</i>), &nbsp;log Σ exp(<i>x<sub>i</sub></i>), &nbsp;(<i>a</i><sup>⊤</sup><i>x</i>)<sup>2</sup>`,
    'ml':`least squares, &nbsp;ridge, &nbsp;logistic loss, &nbsp;Rayleigh quotient`,
    'nn':`tanh and sigmoid layers, &nbsp;softmax cross-entropy, &nbsp;backprop`,
    'tf':`query-key scores, &nbsp;softmax attention, &nbsp;residual paths`,
    'rnn':`shared weights, &nbsp;<i>W</i><sup>2</sup><i>h</i>, &nbsp;unrolled steps`,
    'rl':`policy gradients, &nbsp;softmax policies, &nbsp;Bellman residuals`,
    'all':'a bit of everything'}[level];
}
function render(p){
  const box=$('prob');
  let h=`<div class="math q">${I('f')}(${p.vv}) = ${p.f}</div>`;
  if(p.cond)h+=`<div class="cond">${p.cond}</div>`;
  if(mode==='type'){
    h+=`<div class="eqrow"><span class="math lhs">∇<sub>${p.vv}</sub>${I('f')} =</span><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Gradient"></div>
      <div class="keys">${KEYS.map((k,i)=>`<button data-k="${i}" aria-label="${k[0]}">${k[0]}${k[1]?`<small>${k[1]}</small>`:''}</button>`).join('')}</div>`;
  }else{
    h+=`<div class="eqrow" style="justify-content:center"><span class="math lhs">∇<sub>${p.vv}</sub>${I('f')} = ?</span></div><div class="opts${p.opts.some(o=>o.replace(/<[^>]+>/g,'').length>20)?' wide':''}">${p.opts.map((o,i)=>`<button class="o" data-i="${i}"><small>${i+1}</small><span>${o}</span></button>`).join('')}</div>`;
  }
  box.innerHTML=h;
  const q=box.querySelector('.q');if(q){const base=parseFloat(getComputedStyle(q).fontSize);let f=base;while(q.scrollWidth>q.clientWidth+1&&f>12){f-=1;q.style.fontSize=f+'px'}}
  box.querySelectorAll('.o span').forEach(sp=>{let f=22;while(sp.scrollWidth>sp.clientWidth+1&&f>11){f--;sp.style.fontSize=f+'px'}});
  if(mode==='type'){
    const inp=$('ans');inp.focus();
    const test=()=>{if(check(p,inp.value).ok)solved()};
    inp.addEventListener('input',()=>{
      const c=inp.selectionStart??inp.value.length,pre=sub(inp.value.slice(0,c)),post=sub(inp.value.slice(c));
      if(pre+post!==inp.value){inp.value=pre+post;inp.setSelectionRange(pre.length,pre.length)}
      test();
    });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Tab'){e.preventDefault();skip()}
      if(e.key==='Enter'){e.preventDefault();if(!check(p,inp.value).ok){inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake')}}
    });
    box.querySelectorAll('.keys button').forEach(b=>{
      b.addEventListener('mousedown',e=>e.preventDefault());
      b.addEventListener('click',()=>{const k=KEYS[+b.dataset.k];if(k[2]==='SKIP')return skip();
        const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;
        inp.value=inp.value.slice(0,s)+k[2]+inp.value.slice(e);const pos=s+k[2].length-(k[3]||0);
        inp.focus();inp.setSelectionRange(pos,pos);test()});
    });
  }else box.querySelectorAll('.o').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.i)));
}
function next(){st.p=makeProblem(level);st.pStart=performance.now();st.missedThis=false;st.tries=0;st.lock=false;$('prob').classList.remove('frozen');render(st.p)}
function solved(){st.score++;st.times.push(performance.now()-st.pStart);$('score').textContent=st.score;if(st.score>st.best)$('pbest').textContent=st.score;next()}
function logMiss(){if(st.missedThis)return;st.missedThis=true;st.misses.push(st.p)}
const FREEZE=2000;
function penalty(){st.lock=true;const c=$('prob').querySelector(`.o[data-i="${st.p.ci}"]`);if(c)c.classList.add('right');$('prob').classList.add('frozen');
  const p=st.p;setTimeout(()=>{if(st&&st.p===p){$('prob').classList.remove('frozen');next()}},FREEZE)}
function skip(){if(!st||st.lock)return;logMiss();if(mode==='mc')penalty();else next()}
function choose(i){
  if(!st||mode!=='mc'||st.lock)return;
  const b=$('prob').querySelector(`.o[data-i="${i}"]`);if(!b||b.classList.contains('x'))return;
  if(i===st.p.ci)return solved();
  b.classList.add('x','shake');logMiss();st.tries++;
  if(st.tries>=1)penalty()
}
function sand(f){if(!$('sandTop'))return;f=Math.max(0,Math.min(1,f));const r=Math.sqrt(f),yt=16-9.5*r,wt=8*(16-yt)/10.5;
  $('sandTop').setAttribute('points',f>0.002?`13,16 ${(13-wt).toFixed(2)},${yt.toFixed(2)} ${(13+wt).toFixed(2)},${yt.toFixed(2)}`:'');
  const yb=20+10.5*r,wb=8*(yb-20)/10.5;
  $('sandBot').setAttribute('points',f<0.998?`5,30.5 21,30.5 ${(13+wb).toFixed(2)},${yb.toFixed(2)} ${(13-wb).toFixed(2)},${yb.toFixed(2)}`:'');
  $('stream').setAttribute('y2',yb.toFixed(2))}
function start(){
  const runBoard=board();
  store.set('nablamac:mode2',mode);store.set('nablamac:level',level);store.set('nablamac:dur',dur);
  st={score:0,times:[],misses:[],end:performance.now()+dur*1000};st.best=getBest();$('pbest').textContent=st.best;
  {const run=st;if(apiOK)fetch(`${API}/start`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({board:runBoard})})
    .then(r=>r.ok?r.json():null).then(j=>{if(j&&j.token)run.token=j.token}).catch(()=>{});}
  $('setup').hidden=true;$('done').hidden=true;$('play').hidden=false;
  $('score').textContent='0';$('secs').textContent=dur;document.querySelector('header').classList.add('running');next();tick();
}
function tick(){if(!st)return;const left=Math.max(0,st.end-performance.now());$('secs').textContent=Math.ceil(left/1000);sand(left/(dur*1000));
  if(left<=0)return finish(true);st.raf=requestAnimationFrame(tick)}
function solHTML(m,idx){
  const g=`∇<sub>${m.vv}</sub><i>f</i>`;
  const rows=m.rows.map(r=>`<div class="row"><span class="l">${r.lhs}</span><span class="r${r.fin?' fin':''}">= ${r.h}</span><button class="tag" type="button">${RULES[r.w][0]}</button><span class="rule" hidden>${RULES[r.w][1]}</span></div>`).join('');
  return`<div class="item" data-i="${idx}"><div class="q"><span><i>f</i> = ${m.f}${m.cond?`<span class="c">${m.cond}</span>`:''}</span><span>${g} = ${m.ansH}</span></div>
    <div class="btns"><button class="solb" type="button">solution</button><button class="stepb" type="button">step ▸</button></div><div class="sol">${rows}</div></div>`}
let activeItem=null;
function stepItem(item,dir){const rows=[...item.querySelectorAll('.row')];let n=+(item.dataset.n||rows.length);
  if(dir>0)n=n>=rows.length?1:n+1;else n=Math.max(1,n-1);
  item.dataset.n=n;rows.forEach((r,i)=>r.hidden=i>=n);
  item.querySelector('.stepb').textContent=n>=rows.length?'replay ↺':'next ▸';activeItem=item}
function syncSol(){$('misses').classList.toggle('show',showSol);$('solbtn').setAttribute('aria-pressed',showSol)}
function finish(complete){
  cancelAnimationFrame(st.raf);const s=st;st=null;document.querySelector('header').classList.remove('running');sand(complete?0:1);
  if(!complete){$('play').hidden=true;$('setup').hidden=false;syncChips();return}
  const key=bestKey(),prev=s.best;if(s.score>prev)store.set(key,s.score);
  $('play').hidden=true;$('done').hidden=false;$('final').textContent=s.score;
  $('stats').textContent=`best ${Math.max(prev,s.score)}`+(s.times.length?` · ${(s.times.reduce((a,b)=>a+b,0)/s.times.length/1000).toFixed(1)} s each`:'');
  $('misses').innerHTML=s.misses.map(solHTML).join('');activeItem=null;
  lastRun={token:s.token||null,score:s.score,board:board(),tries:0};
  $('postbtn').hidden=!(lastRun.token&&s.score>0);$('postmsg').textContent='';renderPostBtn();
  loadBoard($('lb2'));
  $('again').focus();
}
document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;syncChips()}));
document.querySelectorAll('#durs button').forEach(b=>b.addEventListener('click',()=>{dur=+b.dataset.d;syncChips()}));
document.querySelectorAll('#lvls button,#topics button').forEach(b=>b.addEventListener('click',()=>{level=b.dataset.l;syncChips()}));
$('misses').addEventListener('click',e=>{
  const t=e.target.closest('.tag');if(t){const r=t.nextElementSibling;r.hidden=!r.hidden;return}
  const sb=e.target.closest('.solb');if(sb){const it=sb.closest('.item'),was=it.classList.contains('open');
    $('misses').querySelectorAll('.item.open').forEach(x=>{x.classList.remove('open');x.querySelector('.solb').textContent='solution'});
    if(!was){it.classList.add('open');sb.textContent='hide';delete it.dataset.n;it.querySelectorAll('.row').forEach(r=>r.hidden=false);it.querySelector('.stepb').textContent='step ▸';activeItem=it}else activeItem=null;return}
  const b=e.target.closest('.stepb');if(b){const it=b.closest('.item');if(!it.dataset.n)it.dataset.n=it.querySelectorAll('.row').length;stepItem(it,1)}});
$('solbtn').addEventListener('click',()=>{showSol=!showSol;store.set('nablamac:sol',showSol?'1':'0');syncSol()});
$('start').addEventListener('click',start);$('again').addEventListener('click',start);
async function postScore(){
  if(!lastRun||!lastRun.token)return;
  if(!me.signedIn||!me.username){pendingPost=true;openPanel();return}
  $('postmsg').textContent='posting…';
  try{const {ok,status,j}=await api('/scores',{token:lastRun.token,score:lastRun.score});
    if(ok){$('postbtn').hidden=true;$('postmsg').textContent=`#${j.rank} on the board`+(j.best>lastRun.score?` with your best of ${j.best}`:'');bust=Date.now();refreshBoards();return}
    if(status===401){me={signedIn:false};renderAcct();$('postmsg').textContent='';pendingPost=true;openPanel();return}
    if(j.error==='run not finished'&&lastRun.tries++<2){setTimeout(postScore,2000);return}
    $('postmsg').textContent=j.error||'could not post'}
  catch(e){$('postmsg').textContent='could not reach the leaderboard'}}
$('postbtn').addEventListener('click',postScore);
$('back').addEventListener('click',()=>{sand(1);$('done').hidden=true;$('setup').hidden=false;syncChips()});
document.addEventListener('keydown',e=>{
  if(!$('panel').hidden){if(e.key==='Escape')closePanel();return}
  if(st){if(e.key==='Escape')return finish(false);if(mode==='mc'&&/^[1-4]$/.test(e.key)){e.preventDefault();choose(+e.key-1)}return}
  if(activeItem&&!$('done').hidden&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();stepItem(activeItem,e.key==='ArrowRight'?1:-1);return}
  if(e.key==='Enter'&&!(document.activeElement&&['BUTTON','INPUT'].includes(document.activeElement.tagName))){e.preventDefault();start()}
});
syncChips();sand(1);loadMe().then(refreshBoards);
window.__nm={makeProblem,check,sub};
})();
</script>
